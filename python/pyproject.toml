[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bachs"
version = "1.0.0a1"
description = "Official Bachs server-side Python SDK"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "anyio>=4",
  "httpx>=0.27,<1",
  "typing_extensions>=4.7",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://bachs.io"
Documentation = "https://docs.bachs.io"
Source = "https://github.com/bachsdev/bachs-python"
Changelog = "https://github.com/bachsdev/bachs-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "trio>=0.25"]

[tool.hatch.build.targets.wheel]
packages = ["src/bachs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["src", "tests/types"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Union[...] keeps runtime type aliases readable and valid on Python 3.10.
ignore = ["UP007"]
